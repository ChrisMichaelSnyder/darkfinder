  - icon: "icons/magic/perception/orb-crystal-ball-scrying.webp"
    text: |
      Sensor
      Type: Core
      SP Cost: 1
      School: Divination
      Casting Time: Standard
      Range: Touch
      Target: 1 creature, object, or surface
      Duration: Concentration
      Saving Throw: Will
      Description:
      You place an invisible sensor on the creature, object or surface. As a Standard action you may see and hear from the sensor with your own senses as if you were located in the same square as the sensor as long as you are within 1 mile of the sensor. While sensing through the sensor this way, you cannot perceive anything from your own body.
      Core Augments:
