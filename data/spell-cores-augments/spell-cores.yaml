      (+6 ): You can sense from any distance, even across planes.
      (+2 ): You may send verbal messages out of the sensor, allowing simple communication.
      (+4 ): You do not need to have line of sight or effect to the target to place the sensor, but you must have a clear mental image of it.
      (+1 ): While sensing through the sensor, you may move it 30ft as a Move action in any direction as if it were a flying creature.

