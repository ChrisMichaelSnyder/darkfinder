      Type: Core
      SP Cost: 1
      School: Enchantment
      Casting Time: Standard
      Range: Touch
      Target: 1 creature
      Duration: 1 Round
      Saving Throw: Will
      Description:
      Affected creature(s) gain the Confused condition. Each time a creature rolls "Act Normally" on the Confusion table, they get an additional chance to save against this effect to end the effect immediately for them.
      Creatures that succeed their initial saving throw are Confused for only 1 round, but may roll twice on the confusion table and choose their result.
