  - name: "Resolve"
    icon: "systems/pf1/icons/skills/blood_04.jpg"
    description: |
      Resolve Check: [[1d20 + @abilities.con.mod]]
      DC 10

      Fail = Lose 1 Resolve Point
      Nat 20 = Stabilize
    category: "Permanent"
    hideFromToken: true
    limitedUses: "Per Day"
    maxUsesFormula: "3+@abilities.con.mod"

  - name: "Short Rest"
    icon: "systems/pf1/icons/skills/green_19.jpg"
    description: |
      Number of Uses per Day: [[@attributes.hd.total]]
      Use to regain Hit Points, Spell Points, Sanity or Fatigue
    category: "Permanent"
    hideFromToken: true
    limitedUses: "Per Day"
    maxUsesFormula: "@attributes.hd.total"

  - name: "Automatic Bonus Progression"
    icon: "systems/pf1/icons/feats/silent-spell.jpg"
    description: |
      Using this buff:

      This buff does not account for weapon/armor/shield enhancement bonus since those are attached to items. You will still need to track those separately.

      Set the item level of this buff equal to your character level.

      Set the first 6 attribute modifications to your stats from most important at the top to least important alternating between mental and physical stats.

      Automatic Bonus Progression Rules

      1st

      —

      2nd

      —

      3rd

      Resistance +1

      4th

      Armor attunement +1, weapon attunement +1

      5th

      Deflection +1

      6th

      Mental prowess +2

      7th

      Physical prowess +2

      8th

      Armor attunement +1/+1, resistance +2, toughening +1, weapon attunement +1/+1

      9th

      Armor attunement +2, weapon attunement +2

      10th

      Deflection +2, resistance +3

      11th

      Mental prowess +4

      12th

      Physical prowess +4

      13th

      Mental prowess +4/+2, physical prowess +4/+2, resistance +4, toughening +2

      14th

      Armor attunement +2/+2 or +3, resistance +5, weapon attunement +2/+2 or +3

      15th

      Armor attunement +3/+3 or +4, mental prowess +6/+2 or +4/+4, weapon attunement +3/+3 or +4

      16th

      Deflection +3, physical prowess +6/+2 or +4/+4, toughening +3

      17th

      Armor attunement +4/+3 or +5, deflection +4, mental prowess +6/+2/+2 or +4/+4/+2, physical prowess +6/+2/+2 or +4/+4/+2, toughening +4, weapon attunement +4/+3 or +5

      18th

      Deflection +5, mental prowess +6/+4/+2 or +4/+4/+4, physical prowess +6/+4/+2 or +4/+4/+4, toughening +5
    category: "Permanent"
    hideFromToken: true
    limitedUses: "Unlimited"
    changes:
      - target: "Intelligence"
        formula: "2*min(1, floor(@attributes.hd.total/6)) + 2*min(2, floor(@attributes.hd.total/11)) + 2*min(2, floor(@attributes.hd.total/15))"
        type: "Enhancement"
      - target: "Dexterity"
        formula: "2*min(1, floor(@attributes.hd.total/7)) + 2*min(2, floor(@attributes.hd.total/12)) + 2*min(2, floor(@attributes.hd.total/16))"
        type: "Enhancement"
      - target: "Wisdom"
        formula: "2*min(1, floor(@attributes.hd.total/13)) + 2*min(2, floor(@attributes.hd.total/18))"
        type: "Enhancement"
      - target: "Constitution"
        formula: "2*min(1, floor(@attributes.hd.total/13)) + 2*min(2, floor(@attributes.hd.total/18))"
        type: "Enhancement"
      - target: "Strength"
        formula: "2*min(1, floor(@attributes.hd.total/17))"
        type: "Enhancement"
      - target: "Charisma"
        formula: "2*min(1, floor(@attributes.hd.total/17))"
        type: "Enhancement"
      - target: "All Saving Throws"
        formula: "min(1, floor(@attributes.hd.total/3)) + min(1, floor(@attributes.hd.total/8)) + min(1, floor(@attributes.hd.total/10)) + min(1, floor(@attributes.hd.total/13)) + min(1, floor(@attributes.hd.total/14))"
        type: "Resistance"
      - target: "Generic AC"
        formula: "min(1, floor(@attributes.hd.total/5)) + min(1, floor(@attributes.hd.total/10)) + min(1, floor(@attributes.hd.total/16)) + min(1, floor(@attributes.hd.total/17)) + min(1, floor(@attributes.hd.total/18))"
        type: "Deflection"
      - target: "Natural Armor AC"
        formula: "min(1, floor(@attributes.hd.total/8)) + min(1, floor(@attributes.hd.total/13)) + min(1, floor(@attributes.hd.total/16)) + min(1, floor(@attributes.hd.total/17)) + min(1, floor(@attributes.hd.total/18))"
        type: "Enhancement"